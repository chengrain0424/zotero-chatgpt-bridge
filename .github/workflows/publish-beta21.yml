name: Publish unified Zotero beta.21

on:
  push:
    branches:
      - feature/windows-edge-chrome

jobs:
  publish-beta21:
    if: contains(github.event.head_commit.message, '[publish-beta21]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test complete Prompt and metadata substitution
        run: |
          node --check src/bridge.js
          node --test tests/attachments.test.js
          python3 tests/smoke.py
      - name: Build and inspect unified Zotero XPI
        run: |
          python3 scripts/build_release.py --owner chengrain0424 --repo zotero-chatgpt-bridge
          python3 - <<'PY'
          import json, re, zipfile
          from pathlib import Path
          version = json.loads(Path('src/manifest.json').read_text())['version']
          assert version == '0.4.0-beta.21', version
          xpi = Path(f'dist/Zotero_to_ChatGPT_Direct_v{version}_Zotero10.xpi')
          with zipfile.ZipFile(xpi) as z:
              assert z.testzip() is None
              assert all(name in z.namelist() for name in ('bridge.js','prefs.xhtml','safari_source.js','windows_source.js'))
              source = z.read('bridge.js').decode('utf-8')
              match = re.search(r'defaultTemplate: ("(?:\\.|[^"\\])*")', source)
              assert match, 'Missing default prompt'
              prompt = json.loads(match.group(1))
              assert len(prompt) == 35986, len(prompt)
              assert '## IV. Scientific tables: structure, readability, and presentation' in prompt
              assert '## III. Scientific figure integration and image handling' in prompt
              assert '## II. Mandatory cross-source consistency and quantitative verification' in prompt
              assert '## 9. Reading Summary and Retrieval Information' in prompt
              assert 'promptMaxLength: 120000' in source
              assert 'area.removeAttribute("maxlength")' in source
              assert 'area.setRangeText(pasted' in source
              assert b'maxlength=' not in z.read('prefs.xhtml')
              assert '## Mandatory preliminary material, elemental and energy balance audit' in prompt
              assert '## Mandatory Obsidian-compatible MathJax notation' in prompt
              assert 'previousBeta18DefaultTemplate:' in source
              assert 'previousBeta20DefaultTemplate:' in source
              assert '### Figure-caption and mixed Markdown/MathJax reliability' in prompt
              assert '### Evidence-check status labels for independent reasoning' in prompt
              assert '### Long tables and printable-page legibility' in prompt
              assert '[Partial balance]' in prompt
              assert '[Not verifiable from available sources]' in prompt
              # Extract the actual PowerShell helper embedded in the distributed
              # XPI. Its build stamp must match manifest.json, not an old release.
              windows_js = z.read('windows_source.js').decode('utf-8')
              assert windows_js.startswith('var WINDOWS_SOURCE = ')
              windows_ps = json.loads(windows_js.split('var WINDOWS_SOURCE = ',1)[1].rsplit(';',1)[0].strip())
              expected = 'v' + version.replace('-', '').replace('beta.', 'beta')
              assert 'WIN_SCRIPT_BUILD ' + expected + ' uia-' in windows_ps
              assert 'function Prepare-UploadStaging(' in windows_ps
              assert 'function Select-ExactFile(' in windows_ps
              assert 'function Place-Prompt(' in windows_ps
              assert 'getWindowsHelperBuild() {' in source
              assert 'this.getWindowsHelperBuild()' in source
              assert 'WIN_SCRIPT_BUILD v0.4.0beta17 uia-20261027' not in source
              bootstrap = z.read('bootstrap.js').decode('utf-8')
              assert 'loadSubScript(rootURI + "windows_source.js", scope)' in bootstrap
              assert 'ZCGBridge.init(scope.SAFARI_SOURCE, scope.WINDOWS_SOURCE)' in bootstrap
              print('PASS XPI: untruncated 35986-char prompt and 120000-char editor limit')
          PY
      - name: Publish beta21 GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='v0.4.0-beta.21'
          asset='dist/Zotero_to_ChatGPT_Direct_v0.4.0-beta.21_Zotero10.xpi'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          cat > /tmp/zotero-release-notes.md <<'NOTES'
          # Zotero ChatGPT Bridge — unified Windows + macOS beta.21

          The **entire 35,986-character latest English scientific reading-note prompt** is now built into the XPI for **Windows Edge/Chrome and macOS Safari**.

          This release refines the user's Zotero/Obsidian research-note default while retaining the already tested Windows helper and PDF + SI upload workflow. Figure captions avoid fragile combinations of Markdown emphasis and LaTeX; independent calculations are distinguished from partial conservation balances and conditional estimates; long comparison tables are discouraged.

          - Increased built-in/editor custom Prompt limit **20,000 → 120,000 characters**.
          - The native HTML maxlength that could silently clip large clipboard pastes has been removed from both editors. The PDF-toolbar editor now intercepts the full clipboard payload, shows a live counter, rejects over-limit pastes without modifying the existing text, and verifies preference readback after Save.
          - Both built-in Prompt entry points use the same default.
          - Saved unchanged older built-in defaults, including beta.20, migrate automatically; genuinely customised prompts are preserved.
          - Windows long-prompt paste logging now verifies the entire expected Prompt (not just the first 30 characters). If verification fails, the clipboard retains the Prompt for manual Ctrl+V.
          - Existing PDF + SI PDF/Word sequential upload and macOS Safari automation are retained. No auto-send.

          Install the attached XPI in Zotero 10, restart Zotero, and use **Restore default** in the Prompt editor to explicitly replace any personalised custom Prompt. Before sending to ChatGPT, verify attachments and inserted Prompt. The 120,000-character setting is a Zotero-side limit; actual browser/ChatGPT handling still requires real-device verification.

          **Important:** Zotero ChatGPT Bridge does not render or export the research-note PDF. PDF table page breaks and final math typography depend on the external Markdown/PDF converter and are not fixed by the XPI itself.

          XPI packaging verifies the full 35,986-character default Prompt, the new layout guidance, the embedded PowerShell build marker, Windows bootstrap loading, and preservation of the 120,000-character Prompt capacity. JavaScript and Windows tests cover the shared plugin. Verify actual ChatGPT paste and attachments before sending.
          NOTES
          gh release create "$tag" "$asset" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease \
            --title "Zotero ChatGPT Bridge v0.4.0-beta.21 (Windows + macOS)" \
            --notes-file /tmp/zotero-release-notes.md
          gh release view "$tag" --json url,assets
