name: Keep historical releases and clean beta 0.4.0 Releases

on:
  push:
    branches:
      - feature/windows-edge-chrome

jobs:
  prune:
    if: contains(github.event.head_commit.message, '[prune-beta-releases]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current stable Release and original historical tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view v0.4.0 --json assets,tagName
          test "$(git rev-parse 'v0.3.0-beta^{commit}')" = '7312b6358fd6f971957462e31f68ac0b328076fd'
          test "$(git rev-parse 'v0.3.9-beta^{commit}')" = 'c0b74b7cfd1f833809e69c1a272df20d09aa0d35'
          gh release view v0.3.9-beta --json assets,tagName
      - name: Verify original v0.3.0 XPI and its checksum
        run: |
          set -euo pipefail
          mkdir -p /tmp/historical-0.3.0
          git show 'v0.3.0-beta:dist/Zotero_to_ChatGPT_Direct_v0.3.0_Zotero10.xpi' > /tmp/historical-0.3.0/Zotero_to_ChatGPT_Direct_v0.3.0_Zotero10.xpi
          git show 'v0.3.0-beta:dist/SHA256SUMS' > /tmp/historical-0.3.0/SHA256SUMS
          (cd /tmp/historical-0.3.0 && sha256sum -c SHA256SUMS)
      - name: Publish v0.3.0 historical original and retitle v0.3.9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v0.3.0-beta >/dev/null 2>&1; then
            gh release create v0.3.0-beta \
              /tmp/historical-0.3.0/Zotero_to_ChatGPT_Direct_v0.3.0_Zotero10.xpi \
              /tmp/historical-0.3.0/SHA256SUMS \
              --verify-tag --title 'Zotero ChatGPT Bridge v0.3.0 (Historical)' \
              --notes 'Historical original v0.3.0 XPI from source tag v0.3.0-beta. The old tag is retained to preserve original source provenance.'
          fi
          gh release edit v0.3.9-beta --title 'Zotero ChatGPT Bridge v0.3.9 (Historical)' \
            --notes 'Historical original v0.3.9 XPI, unmodified, retained under the source tag v0.3.9-beta for exact provenance.'
          for tag in v0.3.0-beta v0.3.9-beta v0.4.0; do
            gh release view "$tag" --json assets,tagName,name
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets | length')" -ge 1
          done
      - name: Delete superseded v0.4.0-beta Release entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | while IFS= read -r tag; do
            case "$tag" in
              v0.3.0-beta|v0.3.9-beta|v0.4.0)
                echo "KEEP: $tag" ;;
              *)
                echo "DELETE old Release: $tag"
                gh release delete "$tag" --yes ;;
            esac
          done
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | sort)"
          expected="$(printf 'v0.3.0-beta\nv0.3.9-beta\nv0.4.0')"
          echo "$actual"
          test "$actual" = "$expected"
          gh release view v0.4.0 --json url,tagName,name

      - name: Mark historical releases and restore v0.4.0 Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub auto-selected the newly created v0.3.0 archive as Latest.
          gh release edit v0.3.0-beta --prerelease
          gh release edit v0.4.0 --latest
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = 'v0.4.0'
          echo 'PASS: v0.4.0 is Latest; historical 0.3.0 remains downloadable.'
