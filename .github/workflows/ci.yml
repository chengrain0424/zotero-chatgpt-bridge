name: CI

# Run only once per PR commit; do not separately run a feature-branch push.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check plugin JavaScript syntax
        run: |
          node --check src/bootstrap.js
          node --check src/bridge.js
          node --test tests/attachments.test.js
      - name: Static smoke test
        run: python3 tests/smoke.py
      - name: Test build package
        run: |
          python3 scripts/build_release.py --owner dummy-owner --repo dummy-repo
          unzip -t dist/*.xpi
          python3 -m json.tool dist/updates.json > /dev/null
