name: Static checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check plugin JavaScript syntax
        run: |
          node --check src/bootstrap.js
          node --check src/bridge.js
          node --check src/bootstrap.js
          node --test tests/attachments.test.js
      - name: Static smoke test
        run: python3 tests/smoke.py
      - name: Test build package
        run: |
          python3 scripts/build_release.py --owner dummy-owner --repo dummy-repo
          python3 -c "from pathlib import Path; import zipfile; packages=list(Path('dist').glob('*v0.4.0-beta.1*.xpi')); assert len(packages)==1; z=zipfile.ZipFile(packages[0]); assert z.testzip() is None; assert 'windows_source.js' in z.namelist()"
          python3 -m json.tool dist/updates.json > /dev/null
