name: Static checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check plugin JavaScript syntax
        run: |
          node --check src/bootstrap.js
          node --check src/bridge.js
          node --check src/bootstrap.js
          node --test tests/attachments.test.js
      - name: Static smoke test
        run: python3 tests/smoke.py
      - name: Test build package
        run: |
          python3 scripts/build_release.py --owner dummy-owner --repo dummy-repo
          python3 -c "from pathlib import Path; import zipfile; packages=list(Path('dist').glob('*v0.4.0-beta.2*.xpi')); assert len(packages)==1; z=zipfile.ZipFile(packages[0]); assert z.testzip() is None; assert 'windows_source.js' in z.namelist()"
          python3 -m json.tool dist/updates.json > /dev/null

      - name: Build experimental Windows installer
        if: github.ref == 'refs/heads/feature/windows-edge-chrome' || github.head_ref == 'feature/windows-edge-chrome'
        run: python3 scripts/build_release.py --owner chengrain0424 --repo zotero-chatgpt-bridge
      - name: Upload Windows XPI installer
        if: github.ref == 'refs/heads/feature/windows-edge-chrome' || github.head_ref == 'feature/windows-edge-chrome'
        uses: actions/upload-artifact@v4
        with:
          name: Zotero-Windows-Experimental-XPI
          path: dist/Zotero_to_ChatGPT_Direct_v0.4.0-beta.2_Zotero10.xpi
          if-no-files-found: error
          retention-days: 30

  windows-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows helper in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('src/Windows_自动上传.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
