name: Static checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check plugin JavaScript syntax
        run: |
          node --check src/bootstrap.js
          node --check src/bridge.js
          node --check src/bootstrap.js
          node --test tests/attachments.test.js
      - name: Static smoke test
        run: python3 tests/smoke.py
      - name: Test build package
        run: |
          python3 scripts/build_release.py --owner dummy-owner --repo dummy-repo
          python3 -c "from pathlib import Path; import zipfile; packages=list(Path('dist').glob('*v0.4.0-beta.8*.xpi')); assert len(packages)==1; z=zipfile.ZipFile(packages[0]); assert z.testzip() is None; assert 'windows_source.js' in z.namelist()"
          python3 -m json.tool dist/updates.json > /dev/null

      - name: Build experimental Windows installer
        if: github.ref == 'refs/heads/feature/windows-edge-chrome' || github.head_ref == 'feature/windows-edge-chrome'
        run: python3 scripts/build_release.py --owner chengrain0424 --repo zotero-chatgpt-bridge
      - name: Upload Windows XPI installer
        if: github.ref == 'refs/heads/feature/windows-edge-chrome' || github.head_ref == 'feature/windows-edge-chrome'
        uses: actions/upload-artifact@v4
        with:
          name: Zotero-Windows-Experimental-XPI
          path: dist/Zotero_to_ChatGPT_Direct_v0.4.0-beta.8_Zotero10.xpi
          if-no-files-found: error
          retention-days: 30

  windows-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows helper in Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('src/windows_upload.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
      - name: Verify Windows helper functions present
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile('src/windows_upload.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw 'Helper parser errors' }
          $functions = @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) | ForEach-Object Name)
          foreach ($name in @('Log-UploadCandidates','Log-PlusButtonState','Log-ForegroundState','Get-FileDialog','Test-OwnedByChat','Click-UIA-Verified','Invoke-UIA','Test-UIATarget','Place-Prompt','Open-FileDialog')) {
            if ($functions -notcontains $name) { throw "Missing helper function: $name" }
          }
      - name: Run helper startup smoke without opening a browser
        shell: powershell
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'zcg_status.log'
          $prompt = Join-Path $env:RUNNER_TEMP 'zcg_prompt.txt'
          $upload = Join-Path $env:RUNNER_TEMP 'zcg_empty_upload_list.txt'
          [IO.File]::WriteAllText($prompt, 'CI test prompt')
          [IO.File]::WriteAllText($upload, '')
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File 'src/windows_upload.ps1' -Browser edge -PromptPath $prompt -UploadListPath $upload -StatusPath $status
          $output = [IO.File]::ReadAllText($status)
          Write-Host $output
          if ($output -notmatch 'POWERSHELL_ENTERED' -or $output -notmatch 'WIN_SCRIPT_BUILD') { throw 'PowerShell helper did not complete initialization' }
          if ($output -match 'INITIALIZATION_ERROR' -or $output -match 'START_BROWSER') { throw 'Unexpected PowerShell startup behavior' }
          # Empty fixture deliberately makes helper exit 1 before opening a browser.
          $global:LASTEXITCODE = 0
